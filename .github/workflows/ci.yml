name: CI

# The pipeline proves the documented checks on a clean machine: lint, formatting
# and the full unit + integration suite against a real PostgreSQL 18. Deployment
# is deliberately out of scope; a green run never touches an environment.
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: motherload
          POSTGRES_PASSWORD: motherload
          POSTGRES_DB: motherload
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U motherload -d motherload"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      NODE_ENV: test
      PORT: 3000
      DATABASE_URL: postgres://motherload:motherload@localhost:5432/motherload
      TEST_DATABASE_URL: postgres://motherload:motherload@localhost:5432/motherload_test
      SESSION_SECRET: ci-only-session-secret-at-least-32-characters
      SESSION_TTL_HOURS: 8
      APP_URL: http://localhost:3000
      HTTPS: 0
      TRUST_PROXY: false
      SEED_DEMO: false
      LOG_LEVEL: silent
      TZ: Europe/Minsk
      # The demo and test windows must not depend on the day CI happens to run.
      ANALYTICS_REFERENCE_DATE: '2026-11-22'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Create the test database
        run: psql "$DATABASE_URL" -c 'CREATE DATABASE motherload_test'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Test
        run: npm test
